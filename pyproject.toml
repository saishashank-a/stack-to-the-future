[project]
name = "stack-to-the-future"
version = "0.1.0"
description = "Claude Code plugin that turns any codebase into an anatomy atlas."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25.0",
    "networkx>=3.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
